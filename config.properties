input.directory=Project/
output.directory=output

submissions.folder=student-submission
testers.folder=Tester-Files
resources.folder=RenameToYourUsername
scoresheet.file=IS442-ScoreSheet.csv

compilation.timeout.seconds=30
execution.timeout.seconds=10

# llm tester generation
exam.pdf.file=TrialExam.pdf
generation.output.dir=Tester-Files-Generated
# possible values: gemini, openai, openai-compatible, ollama
llm.provider=gemini
llm.model=gemini-3.5-flash-lite
llm.base.url=
# name of the variable holding the api key > set it in a git-ignored .env file (see .env.example)
# the key value itself is NEVER stored here > only the variable name
llm.api.key.env=LLM_API_KEY
llm.send.pdf=true
generation.max.retries=1

# if openai is used
# llm.provider=openai
# llm.model=gpt-4o-mini
# llm.base.url=https://api.openai.com/v1

# add-on prompter toggles
prompter.timeout-resistant.enabled=true
prompter.strict-output-format.enabled=true
prompter.extra-edge-cases.enabled=true

