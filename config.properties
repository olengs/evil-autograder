input.directory=Project/
output.directory=output

submissions.folder=student-submission
testers.folder=Tester-Files-Generated-terra
resources.folder=RenameToYourUsernameTemp
scoresheet.file=IS442-ScoreSheet.csv

compilation.timeout.seconds=30
execution.timeout.seconds=10

# llm tester generation
exam.pdf.file=IS442-ExamSample.pdf
exemplar.folder=
generation.output.dir=Tester-Files-Generated-terra
# possible values: gemini, openai, openai-compatible, ollama
# llm.provider=gemini
# llm.model=gemini-3.5-flash-lite
# llm.base.url=
# name of the variable holding the api key > set it in a git-ignored .env file (see .env.example)
# the key value itself is NEVER stored here > only the variable name
llm.api.key.env=LLM_API_KEY
# upload the exam pdf to the model > supported with gemini and openai only
# false means the prompt has no exam content, only the answer template
llm.send.pdf=true
# one generation request for all questions > no automatic repair requests
generation.max.retries=0

# if openai is used
llm.provider=openai
llm.model=gpt-6.1-terra
llm.base.url=https://api.openai.com/v1


