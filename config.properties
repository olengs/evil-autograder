# Required configs
output.directory=./output/
input.directory=Project/
submissions.folder=student-submission/
# submissions.folder=batch-01/
testers.folder=Tester-Files/
resources.folder=RenameToYourUsername/
scoresheet.file=IS442-ScoreSheet.csv
exam.pdf.file=IS442-ExamSample.pdf

# Grading Execution configs
grading.workers=30
compilation.timeout.seconds=10
execution.timeout.seconds=10

# Search depth counts path levels from the extracted answer root (direct files = 1)
submission.header.search.depth=6
submission.answer.search.depth=5

# AI Tester generation config
generation.output.dir=trial
llm.api.key.env=openapikey
llm.model=gpt-6.1-terra
llm.reasoning.effort=high
llm.request.timeout.seconds=240

# Optional misc configs
process.output.max.MiB=2
log.buffer.threshold=30

# Comma-separated log levels (case-insensitive); leave blank to disable logging.
# log.levels=LOG,WARNING,ERROR
log.levels=ERROR
